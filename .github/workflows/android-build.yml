name: HMI_LOGO_PRO V3 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master


jobs:

  build:

    name: Build HMI LOGO PRO APK
    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup Android SDK
      uses: android-actions/setup-android@v3


    - name: Install Android SDK packages
      run: |
        sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"



    - name: Install Gradle 8.9
      run: |

        wget https://services.gradle.org/distributions/gradle-8.9-bin.zip

        unzip -q gradle-8.9-bin.zip

        echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH



    - name: Verify tools
      run: |

        java -version

        gradle --version



    - name: Locate Android project
      run: |

        echo "Searching Android project..."

        SETTINGS=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)


        if [ -z "$SETTINGS" ]; then

          echo "ERROR: settings.gradle not found"

          exit 1

        fi


        ANDROID_DIR=$(dirname "$SETTINGS")


        echo "Android project found:"
        echo "$ANDROID_DIR"


        echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV



    - name: Check project files
      run: |

        echo "Project directory:"
        echo "$ANDROID_DIR"

        ls -la "$ANDROID_DIR"

        echo "Gradle files:"

        find "$ANDROID_DIR" -name "*.gradle"



    - name: Build Debug APK
      run: |

        cd "$ANDROID_DIR"


        gradle assembleDebug \
        --stacktrace \
        --warning-mode all \
        --no-daemon



    - name: Search generated APK
      run: |

        find . -name "*.apk"



    - name: Upload APK
      uses: actions/upload-artifact@v4

      with:

        name: HMI_LOGO_PRO_V3_APK

        path: |

          **/build/outputs/apk/debug/*.apk
